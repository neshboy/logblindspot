# LogBlindSpot log source -> ATT&CK technique visibility mapping.
#
# THIS IS A STARTING POINT, NOT AUTHORITATIVE VENDOR DOCUMENTATION.
# The four sources below (Sysmon, Windows Security Event Log, Zeek, osquery)
# are mapped based on their real, publicly documented default capabilities -
# but exact coverage always depends on YOUR configuration (which Sysmon
# config/EventIDs you enabled, which Windows Advanced Audit Policy
# subcategories are turned on, which Zeek scripts/packages are loaded, which
# osquery tables/packs you actually query and how often). Verify every
# technique ID against your own deployment before trusting the coverage
# numbers - see the README "Limitations" section.
#
# Technique IDs are real MITRE ATT&CK Enterprise IDs (T1055, T1055.011, ...).
# Run `logblindspot check` after editing this file to see how your changes
# move the needle.

version: 1
sources:
  - name: Sysmon
    description: >
      Windows Sysinternals Sysmon (System Monitor) - kernel/ETW-based endpoint
      telemetry: process creation with command line and hashes, network
      connections, image/driver loads, remote thread creation, raw process
      access, file create/delete, registry set/create/rename, DNS query
      events, named pipe and WMI events. Coverage below assumes a
      reasonably thorough Sysmon config (e.g. SwiftOnSecurity/Olaf Hartong
      style configs), not the bare default.
    techniques:
      - T1055        # Process Injection
      - T1055.001    # Dynamic-link Library Injection
      - T1055.002    # Portable Executable Injection
      - T1055.003    # Thread Execution Hijacking
      - T1055.012    # Process Hollowing
      - T1059        # Command and Scripting Interpreter
      - T1059.001    # PowerShell
      - T1059.003    # Windows Command Shell
      - T1059.005    # Visual Basic
      - T1059.007    # JavaScript
      - T1003.001    # OS Credential Dumping: LSASS Memory
      - T1057        # Process Discovery
      - T1082        # System Information Discovery
      - T1071.001    # Application Layer Protocol: Web Protocols
      - T1071.004    # Application Layer Protocol: DNS
      - T1105        # Ingress Tool Transfer
      - T1543.003    # Create or Modify System Process: Windows Service
      - T1547.001    # Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder
      - T1053.005    # Scheduled Task/Job: Scheduled Task
      - T1027        # Obfuscated Files or Information
      - T1036        # Masquerading
      - T1112        # Modify Registry
      - T1070.004    # Indicator Removal: File Deletion
      - T1021.002    # Remote Services: SMB/Windows Admin Shares
      - T1204        # User Execution
      - T1569.002    # System Services: Service Execution
      - T1218        # System Binary Proxy Execution
      - T1140        # Deobfuscate/Decode Files or Information

  - name: Windows Security Event Log
    description: >
      Native Windows Security auditing (Advanced Audit Policy) - logon/logoff,
      account management, and object access events collected without any
      third-party agent. Coverage below assumes the common baseline audit
      subcategories are enabled (Logon/Logoff, Account Management, and
      audit-policy-change auditing); it deliberately does NOT assume
      process-creation command-line auditing (4688 with command-line logging)
      is on, since that overlaps heavily with Sysmon and is frequently left
      disabled.
    techniques:
      - T1078        # Valid Accounts
      - T1078.002    # Valid Accounts: Domain Accounts
      - T1078.003    # Valid Accounts: Local Accounts
      - T1021.001    # Remote Services: Remote Desktop Protocol (4624 logon type 10)
      - T1021.002    # Remote Services: SMB/Windows Admin Shares (5140/5145)
      - T1110        # Brute Force (repeated 4625 failures)
      - T1098        # Account Manipulation
      - T1136        # Create Account (4720)
      - T1531        # Account Access Removal (4724/4726)
      - T1053.005    # Scheduled Task/Job: Scheduled Task (4698)
      - T1543.003    # Create or Modify System Process: Windows Service (4697/7045)
      - T1685.001    # Disable or Modify Tools: Disable or Modify Windows Event Log
      - T1685.005    # Disable or Modify Tools: Clear Windows Event Logs (1102)

  - name: Zeek
    description: >
      Zeek (formerly Bro) network security monitor - protocol-aware traffic
      analysis (conn.log, dns.log, http.log, ssl.log, files.log, notice.log).
      Coverage below assumes the standard base scripts/policy scripts are
      loaded; it does not assume any custom detection packages beyond that.
    techniques:
      - T1071        # Application Layer Protocol
      - T1071.001    # Application Layer Protocol: Web Protocols
      - T1071.004    # Application Layer Protocol: DNS
      - T1041        # Exfiltration Over C2 Channel
      - T1048        # Exfiltration Over Alternative Protocol
      - T1572        # Protocol Tunneling
      - T1090        # Proxy
      - T1573        # Encrypted Channel
      - T1046        # Network Service Discovery (scan patterns in conn.log)
      - T1595        # Active Scanning
      - T1568        # Dynamic Resolution (DNS entropy / fast-flux patterns)
      - T1105        # Ingress Tool Transfer (files.log file extraction)
      - T1499        # Endpoint Denial of Service (traffic volume anomalies)

  - name: osquery
    description: >
      osquery endpoint agent queried on a schedule - exposes OS state as SQL
      tables (processes, services, scheduled_tasks/crontab, startup_items,
      programs, logged_in_users, listening_ports, and similar). This is
      point-in-time state visibility, not continuous event streaming, so it
      is best at revealing persistence and discovery-relevant *state* rather
      than the moment an action occurred.
    techniques:
      - T1543        # Create or Modify System Process
      - T1543.003    # Create or Modify System Process: Windows Service
      - T1053        # Scheduled Task/Job
      - T1053.005    # Scheduled Task/Job: Scheduled Task
      - T1547        # Boot or Logon Autostart Execution
      - T1547.001    # Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder
      - T1136        # Create Account
      - T1098        # Account Manipulation
      - T1518        # Software Discovery
      - T1518.001    # Software Discovery: Security Software Discovery
      - T1012        # Query Registry
      - T1082        # System Information Discovery
      - T1016        # System Network Configuration Discovery
      - T1033        # System Owner/User Discovery
      - T1176        # Software Extensions
      - T1057        # Process Discovery
